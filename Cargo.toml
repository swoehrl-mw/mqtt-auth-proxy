[package]
name = "mqtt-auth-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
mqtt5-protocol = "0.16.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6" }
webpki-roots = "1.0.11"
tracing = { version= "0.1.44", features=["log"] }
tracing-subscriber = { version= "0.3.23", features=["fmt", "json", "std", "registry", "env-filter"] }
rustls = {version = "0.23.46" }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
rumqttc = "0.25.1"
rumqttd = "0.20.0"
# Old version to conform with version used by rumqttd
config = "0.15.27"
certgenutil = "0.1.1"
tempfile = "3.27.0"
